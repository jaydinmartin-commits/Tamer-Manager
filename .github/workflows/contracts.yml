name: Contract tests

on:
  push:
    branches:
      - main
      - feat/access-progression-contracts
  pull_request:

jobs:
  companion-access-progression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run companion access and progression contracts
        run: node --experimental-default-type=module tests/companion-access-progression.test.js

name: Package Tamer Manager

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@v4

      - name: Validate module manifest
        shell: bash
        run: |
          test -f module.json
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("module.json","utf8")); if (m.id !== "tamer-manager") throw new Error("Unexpected module id"); if (!m.version) throw new Error("Missing module version"); if (!m.download.includes("Tamer-Manager/releases/download/v")) throw new Error("Download URL is not isolated to Tamer-Manager");'

      - name: Verify repository isolation
        shell: bash
        run: |
          if grep -R --exclude-dir=.git -nE 'tamer-companion-manager|Tamer-companion-manager' module.json scripts templates styles macros; then
            echo "Historical module reference detected in runtime/package files."
            exit 1
          fi

      - name: Build release archive
        shell: bash
        run: |
          VERSION=$(node -p 'require("./module.json").version')
          TAG="v${VERSION}"
          echo "Packaging ${TAG} from ${GITHUB_SHA}"
          mkdir -p dist
          zip -qr "tamer-manager-${TAG}.zip" . -x '.git/*' '.github/*' 'dist/*' 'tamer-manager-*.zip'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p 'require("./module.json").version')
          TAG="v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to publish."
            exit 0
          fi
          gh release create "${TAG}" \
            "tamer-manager-${TAG}.zip" \
            --title "Tamer Manager ${TAG}" \
            --generate-notes
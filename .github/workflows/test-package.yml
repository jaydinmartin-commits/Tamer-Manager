name: Build testable Foundry package

on:
  push:
    branches:
      - main
      - foundation/persistence-option-store-contracts
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate manifest, entry points, and referenced assets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const manifest = JSON.parse(fs.readFileSync('module.json', 'utf8'));
          if (manifest.id !== 'tamer-manager') throw new Error('Unexpected module ID');
          if (!manifest.version) throw new Error('Missing module version');
          if (!Array.isArray(manifest.esmodules) || !manifest.esmodules.includes('scripts/main.js')) throw new Error('Main entry point missing');
          for (const file of [...manifest.esmodules, ...(manifest.styles ?? [])]) {
            if (!fs.existsSync(file)) throw new Error(`Manifest asset missing: ${file}`);
          }
          for (const file of ['scripts/data/companion-option-store.js', 'scripts/data/companion-option-validator.js', 'scripts/data/companion-tree-store.js', 'scripts/data/tamer-records.js', 'tests/companion-access-progression.test.js', 'tests/data-store-contracts.test.js']) {
            if (!fs.existsSync(file)) throw new Error(`Required contract file missing: ${file}`);
          }
          NODE

      - name: Syntax-check all runtime and test JavaScript
        run: find scripts tests -name "*.js" -print0 | xargs -0 -n1 node --experimental-default-type=module --check

      - name: Run access, progression, and initialization contracts
        run: node --experimental-default-type=module tests/companion-access-progression.test.js

      - name: Run persistence, option-store, and tree-store contracts
        run: node --experimental-default-type=module tests/data-store-contracts.test.js

      - name: Build installable test archive
        shell: bash
        run: |
          VERSION=$(node -p 'require("./module.json").version')
          SHORT_SHA=${GITHUB_SHA::12}
          mkdir -p dist
          zip -qr "dist/tamer-manager-test-v${VERSION}-${SHORT_SHA}.zip" . -x '.git/*' '.github/*' 'dist/*' 'tamer-manager-*.zip'
          unzip -l "dist/tamer-manager-test-v${VERSION}-${SHORT_SHA}.zip" > dist/archive-list.txt
          grep -q 'module.json' dist/archive-list.txt
          grep -q 'scripts/data/companion-tree-store.js' dist/archive-list.txt
          grep -q 'scripts/data/companion-option-store.js' dist/archive-list.txt

      - name: Upload exact-candidate test package
        uses: actions/upload-artifact@v4
        with:
          name: tamer-manager-foundry-test-${{ github.sha }}
          path: dist/tamer-manager-test-*.zip
          if-no-files-found: error
          retention-days: 14
